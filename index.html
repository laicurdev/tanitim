<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaicurDev</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>LaicurDev</h1>
</header>

<main>
    <a href="https://discord.gg/laicur" target="_blank" class="card">
        <svg viewBox="0 0 245 240"><path d="M104.4 0c-25 0-45.3 20.3-45.3 45.3s20.3 45.3 45.3 45.3c25 0 45.3-20.3 45.3-45.3S129.4 0 104.4 0zm36 133c-2.7-3-6-5.2-9.8-6.6 3-1.1 6-2.7 8.5-4.5 0 0-2.2 4.7-8.5 10.1z"/></svg>
        <span>Discord</span>
        <p>Aktif topluluk ve projeler.</p>
    </a>

    <a href="https://www.youtube.com/@laicurdev" target="_blank" class="card">
        <svg viewBox="0 0 24 24"><path d="M23.5 6.2c-.2-1.5-1.5-2.6-3-2.8C18.3 3 12 3 12 3s-6.3 0-8.5.4c-1.5.2-2.8 1.3-3 2.8-.4 2.2-.4 6.8-.4 6.8s0 4.6.4 6.8c.2 1.5 1.5 2.6 3 2.8C5.7 21 12 21 12 21s6.3 0 8.5-.4c1.5-.2 2.8-1.3 3-2.8.4-2.2.4-6.8.4-6.8s0-4.6-.4-6.8zM9.5 15V9l6 3-6 3z"/></svg>
        <span>YouTube</span>
        <p>Kısa ve net içerikler.</p>
    </a>

    <a href="https://www.tiktok.com/@laicurdev" target="_blank" class="card">
        <svg viewBox="0 0 24 24"><path d="M12 2v4c2 .1 3.9 1.1 5.4 2.6V12c-1.5-.2-2.9-.7-4-1.4V21H8V9.2C6.8 8.5 5.2 7.4 4 6V2h8z"/></svg>
        <span>TikTok</span>
        <p>Hızlı ipuçları ve paylaşımlar.</p>
    </a>

    <a href="https://www.roblox.com/tr/users/8748911044/profile" target="_blank" class="card">
        <svg viewBox="0 0 24 24"><path d="M12 0L0 3v18l12 3 12-3V3L12 0zm4.5 18h-9v-3h9v3zm0-5h-9v-3h9v3zm0-5h-9V5h9v3z"/></svg>
        <span>Roblox</span>
        <p>Profil ve oyun içerikleri.</p>
    </a>
</main>

<script>
    const cards = document.querySelectorAll('.card');
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if(entry.isIntersecting){
                entry.target.classList.add('show');
            }
        });
    }, {threshold:0.1});
    cards.forEach(card => observer.observe(card));
</script>

</body>
</html>
